<style>
  #adj,
  #went,
  #ate,
  #saw,
  #enjoyed {
    height: 2.6rem;
    overflow: hidden;
    display: inline-block;
    vertical-align: middle;
    min-width: 175px;
    line-height: 2.6rem;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease, transform 0.25s ease;
  }

  .inshade {
    box-shadow:
      rgba(50, 50, 93, 0.25) 0px 30px 60px -12px inset,
      rgba(0, 0, 0, 0.3) 0px 18px 36px -18px inset;
  }

  .slot-sentence-col {
    font-size: 1.15rem;
    font-weight: 500;
  }

  .slot-reel-item {
    line-height: 2.6rem;
  }

  .combo-svg-wrapper {
    overflow: visible !important;
    padding: 0 4px;
  }

  .combo-svg-wrapper svg {
    height: 36px;
    width: auto;
    display: inline-block;
    vertical-align: middle;
    overflow: visible !important;
  }

  .combo-svg-wrapper path {
    transition: stroke 0.3s ease, filter 0.3s ease;
  }

  .combo-active {
    stroke: #00ff66 !important;
    filter: drop-shadow(0 0 6px rgba(0, 255, 102, 0.95));
  }

  /* Active Field & Speech Recognition Highlights */
  .slot-field-active {
    border: 2.5px solid #0d6efd !important;
    box-shadow: 0 0 12px rgba(13, 110, 253, 0.6), inset 0 0 6px rgba(13, 110, 253, 0.2) !important;
    transform: scale(1.02);
  }

  .slot-box-hit {
    border: 2.5px solid #198754 !important;
    background-color: #d1e7dd !important;
    box-shadow: 0 0 14px rgba(25, 135, 84, 0.65) !important;
    transform: scale(1.04);
  }

  .slot-box-miss {
    border: 2px solid #adb5bd !important;
    background-color: #f8f9fa !important;
  }

  .slot-row {
    transition: background-color 0.25s ease, box-shadow 0.25s ease;
    border-radius: 8px;
    padding: 4px 8px;
  }

  .slot-row-active {
    background-color: rgba(13, 110, 253, 0.06);
    border-left: 4px solid #0d6efd;
  }

  /* Pill Chips */
  .slot-chip {
    display: inline-flex;
    align-items: center;
    padding: 0.2rem 0.65rem;
    margin: 0.15rem 0.2rem;
    border-radius: 999px;
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
    user-select: none;
    transition: all 0.18s ease;
    border: 1.5px solid #ced4da;
    background-color: #ffffff;
    color: #212529;
  }

  .slot-chip:hover:not(.slot-chip-hit) {
    border-color: #0d6efd;
    background-color: #f0f6ff;
    transform: translateY(-1px);
  }

  .slot-chip-selected {
    background-color: #0d6efd !important;
    border-color: #0a58ca !important;
    color: #ffffff !important;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(13, 110, 253, 0.35);
  }

  .slot-chip-hit {
    background-color: #d1e7dd !important;
    border-color: #198754 !important;
    color: #0f5132 !important;
    font-weight: 700;
    cursor: default;
  }

  .combo-legend {
    font-size: 0.72rem;
    color: #6c757d;
    display: flex;
    flex-wrap: nowrap;
    white-space: nowrap;
    justify-content: space-around;
    width: 100%;
    margin-top: -2px;
  }

  .combo-legend span {
    white-space: nowrap;
  }

  .combo-legend span.active {
    color: #198754;
    font-weight: 700;
  }

  .mic-listening {
    animation: mic-pulse 1.4s infinite;
  }

  @keyframes mic-pulse {
    0% {
      box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7);
    }
    70% {
      box-shadow: 0 0 0 10px rgba(220, 53, 69, 0);
    }
    100% {
      box-shadow: 0 0 0 0 rgba(220, 53, 69, 0);
    }
  }
</style>

<script>
  $(function () {
    $(".item").removeClass("active disabled");
    $("#weekend").addClass("active disabled");

    const ORIGINAL_DATA = {
      adj: ["great", "amazing", "fantastic", "wonderful", "interesting", "exciting", "fun", "fine", "good", "busy"],
      went: ["the beach", "the park", "the zoo", "the museum", "the library", "the store", "the aquarium", "a party", "a concert", "the amusement park"],
      saw: ["my friend", "a deer", "my grandmother", "a movie", "a game", "my cousin", "a parade", "a concert", "a play", "my teacher"],
      ate: ["a hotdog", "a hamburger", "pizza", "a sandwich", "a salad", "a taco", "a burrito", "a cookie", "cake", "pie"],
      enjoyed: ["playing games", "watching a movie", "playing sports", "reading a book", "listening to music", "dancing", "singing", "drawing", "painting", "writing"]
    };

    const COMBO_MAP = {
      1: "single",
      2: "double",
      3: "triple",
      4: "quadruple",
      5: "quintuple"
    };

    let pools = {};
    let statusMap = {};
    let selections = {};
    let totalGreenChecks = 0;
    let achievedCombos = new Set();
    let isSpinning = false;
    let needsFieldClear = false;
    let activeCatKey = 'adj';
    let voice = null;

    function toId(str) {
      return str.replace(/ /g, '');
    }

    function normalizeText(text) {
      return (text || '').toLowerCase().replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim();
    }

    function clearAllHighlights() {
      activeCatKey = null;
      $('.slot-row').removeClass('slot-row-active');
      $('#adj, #went, #saw, #ate, #enjoyed').removeClass('slot-field-active');
    }

    function setActiveCategory(catKey) {
      clearAllHighlights();
      if (!voice || !voice.isListening) return;
      if (!catKey || !ORIGINAL_DATA[catKey]) return;
      if (selections[catKey]) return;

      activeCatKey = catKey;
      $(`.slot-row[data-catkey="${catKey}"]`).addClass('slot-row-active');
      $('#' + catKey).addClass('slot-field-active');
    }

    function autoAdvanceActiveCategory() {
      if (!voice || !voice.isListening) {
        clearAllHighlights();
        return;
      }
      for (let key in ORIGINAL_DATA) {
        if (pools[key] && pools[key].length > 0 && !selections[key]) {
          setActiveCategory(key);
          return;
        }
      }
      clearAllHighlights();
    }

    function populateSlotReels() {
      $("#adj, #went, #saw, #ate, #enjoyed").empty();
      for (let catKey in ORIGINAL_DATA) {
        let slotElemId = "#" + catKey;
        $(slotElemId).append(`<div id="${catKey}_empty" class="fs-3 text-center YM slot-reel-item">&nbsp;</div>`);
        for (let item of ORIGINAL_DATA[catKey]) {
          let itemId = catKey + "_" + toId(item);
          $(slotElemId).append(`<div id="${itemId}" class="fs-3 text-center YM slot-reel-item">${item}</div>`);
        }
      }
    }

    function updateSpinButtonState() {
      let activePoolCount = 0;
      let selectedCount = 0;

      for (let catKey in ORIGINAL_DATA) {
        if (pools[catKey] && pools[catKey].length > 0) {
          activePoolCount++;
          if (selections[catKey]) {
            selectedCount++;
          }
        }
      }

      if (activePoolCount === 0) {
        $("#SPIN").addClass("disabled").prop("disabled", true);
        $("#RESET_GAME").removeClass("btn-outline-secondary").addClass("btn-success");
        return false;
      }

      if (isSpinning) {
        $("#SPIN").addClass("disabled").prop("disabled", true);
        return false;
      }

      if (selectedCount === activePoolCount) {
        $("#SPIN").removeClass("disabled").prop("disabled", false);
        return true;
      } else {
        $("#SPIN").addClass("disabled").prop("disabled", true);
        return false;
      }
    }

    function initGame() {
      isSpinning = false;
      needsFieldClear = false;
      pools = {
        adj: ORIGINAL_DATA.adj.slice(),
        went: ORIGINAL_DATA.went.slice(),
        saw: ORIGINAL_DATA.saw.slice(),
        ate: ORIGINAL_DATA.ate.slice(),
        enjoyed: ORIGINAL_DATA.enjoyed.slice()
      };

      statusMap = {};
      selections = {};
      for (let catKey in ORIGINAL_DATA) {
        statusMap[catKey] = {};
        selections[catKey] = null;
        for (let item of ORIGINAL_DATA[catKey]) {
          statusMap[catKey][item] = 'active';
        }
        $("#" + catKey).scrollTop(0).removeClass("slot-box-hit slot-box-miss");
      }

      totalGreenChecks = 0;
      achievedCombos.clear();

      $("#score-checks").text(0);
      $("#you-win-text").addClass("d-none");

      $("#RESET_GAME").removeClass("btn-success").addClass("btn-outline-secondary");

      $("#single, #double, #triple, #quadruple, #quintuple")
        .removeClass("combo-active")
        .css("stroke", "#646464")
        .attr("stroke", "#646464");
      $(".combo-legend span").removeClass("active");

      renderAllOptionGroups();
      updateSpinButtonState();
      autoAdvanceActiveCategory();
    }

    function renderAllOptionGroups() {
      for (let catKey in ORIGINAL_DATA) {
        renderOptionGroup(catKey);
      }
    }

    function renderOptionGroup(catKey) {
      let groupContainer = $("#group-" + catKey);
      groupContainer.empty();

      ORIGINAL_DATA[catKey].forEach((item) => {
        let st = statusMap[catKey][item];
        let isSelected = selections[catKey] === item;

        if (st === 'active') {
          let extraClass = isSelected ? 'slot-chip-selected' : '';
          let iconHtml = isSelected
            ? `<i class="material-icons fs-6 me-1">radio_button_checked</i>`
            : '';
          let chipHtml = `
            <span class="slot-chip ${extraClass}" data-catkey="${catKey}" data-item="${item}">
              ${iconHtml}${item}
            </span>
          `;
          groupContainer.append(chipHtml);
        } else if (st === 'green_check') {
          let chipHtml = `
            <span class="slot-chip slot-chip-hit" title="Matched!">
              <i class="material-icons fs-6 me-1">check_circle</i>${item}
            </span>
          `;
          groupContainer.append(chipHtml);
        }
      });
    }

    function selectItem(catKey, item) {
      if (isSpinning) return;
      if (!pools[catKey] || statusMap[catKey][item] !== 'active') return;

      if (needsFieldClear) {
        needsFieldClear = false;
        $("#adj, #went, #saw, #ate, #enjoyed").stop(true, true).scrollTop(0).removeClass("slot-box-hit slot-box-miss");
      }

      selections[catKey] = item;
      $("#" + catKey).removeClass("slot-box-hit slot-box-miss");
      renderOptionGroup(catKey);
      let isReady = updateSpinButtonState();
      autoAdvanceActiveCategory();
      return isReady;
    }

    function matchSpokenOption(transcript) {
      const spoken = normalizeText(transcript);
      if (!spoken) return null;

      function checkCategory(catKey) {
        if (!pools[catKey] || pools[catKey].length === 0 || selections[catKey]) return null;
        for (let item of ORIGINAL_DATA[catKey]) {
          if (statusMap[catKey][item] !== 'active') continue;
          let normItem = normalizeText(item);
          if (spoken === normItem || spoken.includes(normItem) || normItem.includes(spoken)) {
            return { catKey, item };
          }
        }
        return null;
      }

      if (activeCatKey) {
        let match = checkCategory(activeCatKey);
        if (match) return match;
      }

      for (let catKey in ORIGINAL_DATA) {
        if (catKey === activeCatKey) continue;
        let match = checkCategory(catKey);
        if (match) return match;
      }

      return null;
    }

    function runit() {
      if (isSpinning) return;
      isSpinning = true;
      $("#SPIN").addClass("disabled").prop("disabled", true);

      let roundHits = 0;
      let hitResults = {};
      let categoriesOrder = ['adj', 'went', 'saw', 'ate', 'enjoyed'];

      for (let catKey of categoriesOrder) {
        let pool = pools[catKey];
        if (!pool || pool.length === 0) continue;

        let randIndex = Math.floor(Math.random() * pool.length);
        let hitItem = pool[randIndex];
        let selIdx = pool.indexOf(selections[catKey]);
        if (selIdx !== -1) pool.splice(selIdx, 1);
        hitResults[catKey] = { selected: selections[catKey], hit: hitItem };
      }

      let activeCats = categoriesOrder.filter(c => hitResults[c]);
      activeCats.forEach((catKey, idx) => {
        setTimeout(() => {
          let res = hitResults[catKey];
          let isHit = (res.selected === res.hit);

          // Spin the reel to the drawn item
          spinit(catKey, catKey + '_' + toId(res.hit));

          // Update chips and field status right when the 500ms reel spin lands
          setTimeout(() => {
            if (isHit) {
              statusMap[catKey][res.selected] = 'green_check';
              totalGreenChecks++;
              roundHits++;
              $("#" + catKey).removeClass("slot-box-miss").addClass("slot-box-hit");
            } else if (res.selected) {
              statusMap[catKey][res.selected] = 'removed';
              $("#" + catKey).removeClass("slot-box-hit").addClass("slot-box-miss");
            }

            // Clear chip selection for this field after spin (must re-pick next round)
            selections[catKey] = null;

            renderOptionGroup(catKey);
            $("#score-checks").text(totalGreenChecks);
          }, 500);
        }, idx * 250);
      });

      setTimeout(() => {
        let comboBonus = 0;
        if (COMBO_MAP[roundHits]) {
          let comboPathId = COMBO_MAP[roundHits];
          if (!achievedCombos.has(comboPathId)) {
            achievedCombos.add(comboPathId);
            $("#" + comboPathId)
              .addClass("combo-active")
              .css("stroke", "#00ff66")
              .attr("stroke", "#00ff66");
            $("#legend-" + comboPathId).addClass("active");

            comboBonus = roundHits;
            totalGreenChecks += comboBonus;

            if (achievedCombos.size === 5) {
              $("#you-win-text").removeClass("d-none");
            }
          }
        }

        $("#score-checks").text(totalGreenChecks);
        isSpinning = false;
        needsFieldClear = true;
        renderAllOptionGroups();
        updateSpinButtonState();
        autoAdvanceActiveCategory();
      }, (activeCats.length - 1) * 250 + 550);
    }

    // Click on pill chip
    $(document).off('click.weekendChip').on('click.weekendChip', '.slot-chip', function (e) {
      e.stopPropagation();
      let catKey = $(this).data('catkey');
      let item = $(this).data('item');
      if (catKey && item) {
        selectItem(catKey, item);
      }
    });

    // Set active field on row click
    $(document).off('click.weekendRow').on('click.weekendRow', '.slot-row', function () {
      let catKey = $(this).data('catkey');
      if (catKey && voice && voice.isListening) {
        setActiveCategory(catKey);
      }
    });

    $("#SPIN").on('click', function () {
      if ($(this).hasClass("disabled") || isSpinning) return;
      runit();
    });

    $("#RESET_GAME").on('click', function () {
      initGame();
    });

    populateSlotReels();
    initGame();

    const allVocab = [].concat(
      ORIGINAL_DATA.adj,
      ORIGINAL_DATA.went,
      ORIGINAL_DATA.saw,
      ORIGINAL_DATA.ate,
      ORIGINAL_DATA.enjoyed,
      ['spin', 'reset']
    );

    voice = new SpeechController({
      toggleBtn: '#MIC_TOGGLE',
      toggleIdleText: 'Mic',
      toggleActiveText: 'Stop',
      unsupportedAlert: '#speech-unsupported-alert',
      vocab: allVocab,
      maxAlternatives: 4,
      onStatusChange: (status) => {
        if (status === 'listening') {
          autoAdvanceActiveCategory();
        } else if (status === 'stopped' || status === 'error') {
          clearAllHighlights();
        }
      },
      onResult: (transcript, alternatives) => {
        for (const alt of alternatives) {
          if (/\bspin\b/i.test(alt)) {
            if (!$("#SPIN").hasClass("disabled") && !isSpinning) {
              runit();
              return true;
            }
          }
          if (/\b(reset|start over)\b/i.test(alt)) {
            initGame();
            return true;
          }
          const matched = matchSpokenOption(alt);
          if (matched) {
            const isReady = selectItem(matched.catKey, matched.item);
            if (isReady) {
              setTimeout(() => {
                if (!$("#SPIN").hasClass("disabled") && !isSpinning) {
                  runit();
                }
              }, 400);
            }
            return true;
          }
        }
        return false;
      }
    });
  });
</script>
